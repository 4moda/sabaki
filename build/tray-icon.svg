<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="tray-clip">
      <rect x="1.5" y="1.5" width="29" height="29" rx="7" />
    </clipPath>
    <clipPath id="tray-paw-clip">
      <path d="M7 31.5 L9.8 20.8 C10.4 18.2 13 16.8 15.6 17.5 C18.1 18.2 19.6 20.6 18.9 23.2 L16.5 31.5 Z" />
    </clipPath>
  </defs>

  <!-- Soft mint badge for clear legibility on both light and dark taskbars -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="#D1FAE5" />

  <g clip-path="url(#tray-clip)">
    <!-- Amber card (left-tilted) -->
    <g transform="rotate(-18 14 15)">
      <rect x="7" y="5.5" width="11.5" height="14.5" rx="2.5" fill="#FBBF24" stroke="#1E293B" stroke-width="1.8" />
    </g>

    <!-- Emerald SD card (right-tilted) -->
    <g transform="rotate(14 18 15)">
      <path
        d="M13.5 5.5 H20.8 L24 8.7 V17.8 C24 19 23 20 21.8 20 H13.5 C12.3 20 11.3 19 11.3 17.8 V7.7 C11.3 6.5 12.3 5.5 13.5 5.5 Z"
        fill="#10B981"
        stroke="#1E293B"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
    </g>

    <!-- Sabatora cat paw reaching from bottom-left -->
    <g clip-path="url(#tray-paw-clip)">
      <path
        d="M7 31.5 L9.8 20.8 C10.4 18.2 13 16.8 15.6 17.5 C18.1 18.2 19.6 20.6 18.9 23.2 L16.5 31.5 Z"
        fill="#CBD5E1"
      />
      <path
        d="M9.1 23 C9.9 19.4 12.7 17.6 15.6 18.4 C18.2 19.1 19.2 21.6 18.2 24.6 C15.7 25.1 11.6 24.4 9.1 23 Z"
        fill="#F8FAFC"
      />
      <!-- Pink toe pad -->
      <ellipse cx="14" cy="22.2" rx="2.1" ry="1.5" transform="rotate(14 14 22.2)" fill="#FB7185" />
      <!-- Tabby stripe cleanly clipped inside arm -->
      <path d="M7.5 26.5 L12.5 27.7" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
    </g>
    <path
      d="M7 31.5 L9.8 20.8 C10.4 18.2 13 16.8 15.6 17.5 C18.1 18.2 19.6 20.6 18.9 23.2 L16.5 31.5 Z"
      fill="none"
      stroke="#1E293B"
      stroke-width="1.9"
      stroke-linejoin="round"
    />
  </g>

  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#10B981" stroke-width="1.8" />
</svg>
